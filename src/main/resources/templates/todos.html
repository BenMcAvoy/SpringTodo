<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Todos</title>

    <!-- play cdn -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen bg-gray-200 px-4 py-12 font-sans text-gray-800 flex items-center justify-center">

<main class="mx-auto max-w-4xl rounded-lg bg-white p-8 min-w-2xl shadow-sm">
    <!-- title -->
    <h1 class="text-3xl font-bold">My todos</h1>

    <!-- error if there is one -->
    <p class="mt-4 text-red-700" th:if="${error}" th:text="${error}"></p>

    <!-- add todo form post to /ui/todos handled by TodoPageController -->
    <form class="my-6 flex gap-2" action="/ui/todos" method="post">
        <!-- title input field -->
        <input class="min-w-0 flex-1 rounded-lg border border-gray-300 px-3 py-2 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200" type="text" name="title" placeholder="Add a todo…" required maxlength="200" aria-label="Todo title">

        <!-- add button -->
        <button class="rounded-lg bg-mauve-700 px-4 py-2 font-medium text-white hover:bg-mauve-700" type="submit">Add</button>
    </form>

    <!-- inform to add one if there is no todo yet -->
    <!-- lua style table empty check -->
    <p class="text-gray-500" th:if="${#lists.isEmpty(todos)}">No todos yet. Add one above.</p>

    <!-- list -->
    <ul class="divide-y divide-gray-200">
        <!-- list for each todo in todos -->
        <li class="flex items-center gap-3 py-3" th:each="todo : ${todos}">
            <!-- toggle completed status -->
            <form th:action="@{/ui/todos/{id}/toggle(id=${todo.id})}" method="post">
                <button class="rounded-lg bg-mauve-700 px-3 py-2 text-sm font-medium text-white hover:bg-mauve-700" type="submit" th:text="${todo.completed} ? 'Undo' : 'Done'"></button>
            </form>

            <!-- title -->
            <span class="min-w-0 flex-1 break-words" th:classappend="${todo.completed} ? 'text-gray-500 line-through' : ''" th:text="${todo.title}">Todo title</span>

            <!-- delete button -->
            <form th:action="@{/ui/todos/{id}/delete(id=${todo.id})}" method="post">
                <button class="rounded-lg bg-gray-200 px-3 py-2 text-sm font-medium text-gray-700 hover:bg-gray-300" type="submit" aria-label="Delete todo">Delete</button>
            </form>
        </li>
    </ul>
</main>

</body>

</html>
